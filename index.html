<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coffee Dial-in Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel (브라우저에서 React 코드 해석용) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { 
            background-color: #171717; /* neutral-900 */
            color: #f5f5f5; 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React App Code -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Inline SVG Icons (Lucide 대용, 단일 파일 배포를 위해 인라인 삽입) ---
        const IconCoffee = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></svg>;
        const IconTimer = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>;
        const IconHistory = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>;
        const IconPlus = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
        const IconChevronRight = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>;
        const IconChevronLeft = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m15 18-6-6 6-6"/></svg>;
        const IconPlay = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"/></svg>;
        const IconSquare = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/></svg>;
        const IconCheck = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>;
        const IconPlusCircle = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>;
        const IconMinusCircle = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>;
        const IconAlertCircle = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;
        const IconFlame = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>;
        const IconDroplets = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7 2.9 7 2.9s-2.29 6.16-2.29 6.16C3.57 10 3 11.08 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 1 14 6c2.2 0 4 1.83 4 4.05 0 1.16-.57 2.26-1.71 3.19S14 24 14 24s-2.29-6.16-2.29-6.16C10.57 16.9 10 15.82 10 14.65a4.08 4.08 0 0 1 .58-2.15z"/></svg>;
        const IconTrash2 = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;
        const IconSliders = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>;

        // --- Data Models & Constants ---
        const ROAST_LEVELS = [
          { id: 'dark', label: '강배전', a2Esp: 32, a2Drip: 44, m40Esp: 28, m40Drip: 46 },
          { id: 'med-dark', label: '중강배전', a2Esp: 30, a2Drip: 42, m40Esp: 26, m40Drip: 44 },
          { id: 'medium', label: '중배전', a2Esp: 29, a2Drip: 40, m40Esp: 24, m40Drip: 42 },
          { id: 'med-light', label: '중약배전', a2Esp: 28, a2Drip: 38, m40Esp: 22, m40Drip: 39 },
          { id: 'light', label: '약배전', a2Esp: 27, a2Drip: 36, m40Esp: 20, m40Drip: 35 },
        ];

        const INITIAL_BEANS = [
          { id: 'b1', name: '폴 바셋 (시그니처)', roast: 'dark' },
          { id: 'b2', name: '블루보틀 볼드', roast: 'med-dark' },
          { id: 'b3', name: '블루보틀 에스프레소', roast: 'medium' },
          { id: 'b4', name: '블루보틀 밸런스', roast: 'med-light' },
          { id: 'b5', name: '블루보틀 브라이트', roast: 'light' },
        ];

        const GRINDERS = [
          { id: 'a2', name: '페모북 A2 (M8 개조)' },
          { id: 'm40', name: '미스치프 M40 (RC)' }
        ];

        const PRESET_RECIPES = {
          golden: [
            { label: "1차 주수", target: "50g", hint: "50g까지 원을 그리며 붓고 버튼을 누르세요." },
            { label: "뜸들이기", target: "30초", hint: "타이머가 30초가 될 때까지 기다립니다." },
            { label: "2차 주수", target: "150g", hint: "150g까지 부드럽게 나선형으로 붓습니다." },
            { label: "3차 주수", target: "250g", hint: "250g까지 부은 후 스며들기를 기다립니다." },
            { label: "물 빠짐 완료", target: "완료", hint: "물이 모두 빠지면 완료 버튼을 누르세요." }
          ],
          immersion: [
            { label: "전체 주수", target: "200g", hint: "200g까지 한 번에 부어주세요." },
            { label: "침출 대기", target: "2분", hint: "타이머 2분이 될 때까지 기다립니다." },
            { label: "스위치 개방", target: "스위치 ON", hint: "스위치를 열어 물을 배수시킵니다." },
            { label: "물 빠짐 완료", target: "완료", hint: "배수가 모두 끝나면 완료 버튼을 누르세요." }
          ]
        };

        // --- Main Application Component ---
        function App() {
          const [activeTab, setActiveTab] = useState('brew'); // 'brew', 'history', 'recs'
          
          // App State (with LocalStorage for persistence)
          const [beans, setBeans] = useState(() => {
            const saved = localStorage.getItem('dialin-beans');
            return saved ? JSON.parse(saved) : INITIAL_BEANS;
          });
          const [history, setHistory] = useState(() => {
            const saved = localStorage.getItem('dialin-history');
            return saved ? JSON.parse(saved) : [];
          });
          const [recommendations, setRecommendations] = useState(() => {
            const saved = localStorage.getItem('dialin-recs');
            return saved ? JSON.parse(saved) : {};
          });

          // Save to LocalStorage whenever state changes
          useEffect(() => { localStorage.setItem('dialin-beans', JSON.stringify(beans)); }, [beans]);
          useEffect(() => { localStorage.setItem('dialin-history', JSON.stringify(history)); }, [history]);
          useEffect(() => { localStorage.setItem('dialin-recs', JSON.stringify(recommendations)); }, [recommendations]);

          const today = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });

          return (
            <div className="min-h-screen flex flex-col">
              {/* Header */}
              <header className="bg-neutral-950 p-4 border-b border-neutral-800 flex justify-between items-center sticky top-0 z-10">
                <div className="flex items-center gap-2">
                  <IconCoffee className="text-amber-500" />
                  <h1 className="text-lg font-bold tracking-wide">Dial-in Tracker</h1>
                </div>
                <div className="flex flex-col items-end">
                  <span className="text-[10px] text-amber-500 font-mono font-bold tracking-wider">v1.2.0</span>
                  <span className="text-[10px] text-neutral-400">{today}</span>
                </div>
              </header>

              {/* Main Content Area */}
              <main className="flex-1 overflow-y-auto p-4 pb-24">
                {activeTab === 'brew' && (
                  <BrewWizard 
                    beans={beans} 
                    setBeans={setBeans}
                    recommendations={recommendations}
                    setRecommendations={setRecommendations}
                    onSaveLog={(log) => {
                      setHistory([log, ...history]);
                      setActiveTab('history');
                    }}
                  />
                )}
                {activeTab === 'recs' && (
                  <RecsTab beans={beans} recommendations={recommendations} />
                )}
                {activeTab === 'history' && (
                  <HistoryTab history={history} />
                )}
              </main>

              {/* Bottom Navigation */}
              <nav className="bg-neutral-950 border-t border-neutral-800 fixed bottom-0 w-full flex justify-around p-3 pb-safe">
                <button 
                  onClick={() => setActiveTab('brew')}
                  className={`flex flex-col items-center gap-1 w-20 ${activeTab === 'brew' ? 'text-amber-500' : 'text-neutral-500 hover:text-neutral-300'}`}
                >
                  <IconTimer size={24} />
                  <span className="text-xs font-medium">추출</span>
                </button>
                <button 
                  onClick={() => setActiveTab('recs')}
                  className={`flex flex-col items-center gap-1 w-20 ${activeTab === 'recs' ? 'text-amber-500' : 'text-neutral-500 hover:text-neutral-300'}`}
                >
                  <IconSliders size={24} />
                  <span className="text-xs font-medium">추천값</span>
                </button>
                <button 
                  onClick={() => setActiveTab('history')}
                  className={`flex flex-col items-center gap-1 w-20 ${activeTab === 'history' ? 'text-amber-500' : 'text-neutral-500 hover:text-neutral-300'}`}
                >
                  <IconHistory size={24} />
                  <span className="text-xs font-medium">기록</span>
                </button>
              </nav>
            </div>
          );
        }

        // --- Brew Wizard Component (Multi-step) ---
        function BrewWizard({ beans, setBeans, recommendations, setRecommendations, onSaveLog }) {
          const [step, setStep] = useState(1);
          
          // Selections
          const [method, setMethod] = useState(''); // 'espresso', 'drip'
          const [beanId, setBeanId] = useState('');
          const [grinderId, setGrinderId] = useState('');
          const [dripRecipeType, setDripRecipeType] = useState('golden');
          const [dripTargets, setDripTargets] = useState(PRESET_RECIPES.golden);
          
          // Timer & Adjustments
          const [time, setTime] = useState(0);
          const [adjustedTime, setAdjustedTime] = useState(0);
          const [recommendedClick, setRecommendedClick] = useState(0);
          const [usedClick, setUsedClick] = useState(0);
          const [lapTimes, setLapTimes] = useState([]);

          const getDefaultClick = (bId, mthd, gId) => {
            const bean = beans.find(b => b.id === bId);
            if (!bean) return 0;
            const roastData = ROAST_LEVELS.find(r => r.id === bean.roast);
            if (!roastData) return 0;
            
            if (mthd === 'espresso') {
              return gId === 'a2' ? roastData.a2Esp : roastData.m40Esp;
            } else {
              return gId === 'a2' ? roastData.a2Drip : roastData.m40Drip;
            }
          };

          const handleNextStep = () => {
            if (step === 3 && method === 'espresso') {
              setStep(5);
            } else {
              setStep(s => s + 1);
            }
          };
          
          const handlePrevStep = () => {
            if (step === 5 && method === 'espresso') {
              setStep(3);
            } else {
              setStep(s => Math.max(1, s - 1));
            }
          };

          if (step === 1) {
            return (
              <div className="space-y-4 duration-300">
                <h2 className="text-xl font-bold text-white mb-6">어떤 커피를 내리실 건가요?</h2>
                <div className="grid grid-cols-2 gap-4">
                  <SelectionCard 
                    title="에스프레소" 
                    subtitle="밤비노 플러스"
                    icon={<IconCoffee size={32} />}
                    selected={method === 'espresso'}
                    onClick={() => { setMethod('espresso'); handleNextStep(); }}
                  />
                  <SelectionCard 
                    title="드립 (푸어오버)" 
                    subtitle="하리오 스위치"
                    icon={<IconTimer size={32} />}
                    selected={method === 'drip'}
                    onClick={() => { setMethod('drip'); handleNextStep(); }}
                  />
                </div>
              </div>
            );
          }

          if (step === 2) {
            return (
              <div className="space-y-4 duration-300">
                <div className="flex items-center gap-2 mb-6">
                  <button onClick={handlePrevStep} className="text-neutral-400 hover:text-white p-1 -ml-1">
                    <IconChevronLeft size={24} />
                  </button>
                  <h2 className="text-xl font-bold text-white">원두를 선택하세요</h2>
                </div>
                
                <div className="space-y-3">
                  {beans.map(bean => (
                    <div 
                      key={bean.id}
                      onClick={() => { setBeanId(bean.id); handleNextStep(); }}
                      className="bg-neutral-800 border border-neutral-700 p-4 rounded-xl flex justify-between items-center active:bg-neutral-700 transition-colors cursor-pointer"
                    >
                      <div>
                        <p className="font-semibold text-white text-lg">{bean.name}</p>
                        <p className="text-sm text-neutral-400">{ROAST_LEVELS.find(r => r.id === bean.roast)?.label}</p>
                      </div>
                      <IconChevronRight className="text-neutral-500" />
                    </div>
                  ))}
                  <AddNewBeanForm 
                    onAdd={(newBean) => {
                      setBeans([...beans, newBean]);
                      setBeanId(newBean.id);
                      handleNextStep();
                    }} 
                  />
                </div>
              </div>
            );
          }

          if (step === 3) {
            return (
              <div className="space-y-4 duration-300">
                <div className="flex items-center gap-2 mb-6">
                  <button onClick={handlePrevStep} className="text-neutral-400 hover:text-white p-1 -ml-1">
                    <IconChevronLeft size={24} />
                  </button>
                  <h2 className="text-xl font-bold text-white">그라인더 선택</h2>
                </div>
                
                <div className="space-y-3">
                  {GRINDERS.map(g => (
                    <div 
                      key={g.id}
                      onClick={() => { 
                        setGrinderId(g.id); 
                        const recKey = `${beanId}_${method}_${g.id}`;
                        const savedClick = recommendations[recKey];
                        setRecommendedClick(savedClick || getDefaultClick(beanId, method, g.id));
                        handleNextStep(); 
                      }}
                      className="bg-neutral-800 border border-neutral-700 p-4 rounded-xl flex justify-between items-center active:bg-neutral-700 transition-colors cursor-pointer"
                    >
                      <p className="font-semibold text-white text-lg">{g.name}</p>
                      <IconChevronRight className="text-neutral-500" />
                    </div>
                  ))}
                </div>
              </div>
            );
          }

          if (step === 4) {
            return (
              <RecipeSelection 
                onBack={handlePrevStep}
                onSelect={(type, targets) => {
                  setDripRecipeType(type);
                  setDripTargets(targets);
                  handleNextStep();
                }}
              />
            );
          }

          if (step === 5) {
            return (
              <TimerSection 
                method={method}
                recommendedClick={recommendedClick}
                dripTargets={dripTargets}
                onBack={handlePrevStep}
                onComplete={(finalTime, finalClick, finalLaps) => {
                  setTime(finalTime);
                  setAdjustedTime(finalTime);
                  setUsedClick(finalClick);
                  setLapTimes(finalLaps);
                  setStep(6);
                }}
              />
            );
          }

          if (step === 6) {
            const handleEvaluateAndSave = () => {
              let evalResult = {};
              let nextClick = usedClick;
              let clickDelta = grinderId === 'a2' ? 1 : 2;

              if (method === 'espresso') {
                if (adjustedTime < 20) {
                  evalResult = { status: 'fast', message: '너무 빠릅니다 (과소추출). 쓴맛이 적고 시큼할 수 있습니다.', tip: `다음엔 분쇄도를 ${clickDelta * 2}클릭 조여보세요.` };
                  nextClick -= (clickDelta * 2);
                } else if (adjustedTime >= 20 && adjustedTime < 25) {
                  evalResult = { status: 'fast-ish', message: '약간 빠릅니다. 조금 더 쫀득한 질감을 원하시면 조여주세요.', tip: `다음엔 분쇄도를 ${clickDelta}클릭 조여보세요.` };
                  nextClick -= clickDelta;
                } else if (adjustedTime >= 25 && adjustedTime <= 30) {
                  evalResult = { status: 'perfect', message: '완벽합니다! 황금빛 크레마와 밸런스를 즐기세요.', tip: '현재 세팅을 유지하세요.' };
                } else if (adjustedTime > 30 && adjustedTime <= 35) {
                  evalResult = { status: 'slow-ish', message: '약간 느립니다. 쓴맛이 튄다면 풀어주세요.', tip: `다음엔 분쇄도를 ${clickDelta}클릭 풀어보세요.` };
                  nextClick += clickDelta;
                } else {
                  evalResult = { status: 'slow', message: '너무 느립니다 (과다추출). 쓰고 떫은 맛이 날 수 있습니다.', tip: `다음엔 분쇄도를 ${clickDelta * 2}클릭 풀어보세요.` };
                  nextClick += (clickDelta * 2);
                }
              } else {
                const durations = [];
                for (let i = 0; i < lapTimes.length; i++) {
                  durations.push(i === 0 ? lapTimes[0].time : lapTimes[i].time - lapTimes[i - 1].time);
                }
                const finalDrawdown = adjustedTime - (lapTimes.length > 0 ? lapTimes[lapTimes.length - 1].time : 0);
                durations.push(finalDrawdown);

                if (dripRecipeType === 'golden') {
                  if (finalDrawdown < 25) {

                  } else if (finalDrawdown > 55) {
                     evalResult = { status: 'slow', message: `후반부 물 빠짐이 지연되었습니다 (${finalDrawdown}초).`, tip: `다음엔 분쇄도를 ${clickDelta * 2}클릭 풀어보세요.` };

                  }

                  if (finalDrawdown > 50) {
                    evalResult = { status: 'slow', message: `침출 후 배수가 너무 느립니다 (${finalDrawdown}초).`, tip: `다음엔 분쇄도를 ${clickDelta * 2}클릭 풀어보세요.` };
                    nextClick += (clickDelta * 2);
                  } else if (finalDrawdown < 20) {
                    evalResult = { status: 'fast', message: `침출 후 배수가 너무 빠릅니다 (${finalDrawdown}초).`, tip: `다음엔 분쇄도를 ${clickDelta * 2}클릭 조여보세요.` };
                    nextClick -= (clickDelta * 2);
                  } else {
                    evalResult = { status: 'perfect', message: `안정적인 배수 시간입니다 (${finalDrawdown}초)!`, tip: '현재 세팅을 유지하세요.' };
                  }
                } else {
                  if (finalDrawdown < 20) {
                    evalResult = { status: 'fast', message: `마지막 배수 구간이 다소 빠릅니다 (${finalDrawdown}초).`, tip: `필요하다면 ${clickDelta}클릭 조여보세요.` };

                  } else if (finalDrawdown > 60) {
                    evalResult = { status: 'slow', message: `마지막 배수 구간이 다소 느립니다 (${finalDrawdown}초).`, tip: `필요하다면 ${clickDelta}클릭 풀어보세요.` };

              const recKey = `${beanId}_${method}_${grinderId}`;

              const beanName = beans.find(b => b.id === beanId)?.name;

          const handleRemovePhase = (index) => {

          if (customMode) {

              <div className="space-y-4 duration-300">
                <div className="flex items-center gap-2 mb-4">

              </div>

        const parseTargetTime = (target) => {
          if (!target) return null;
          if (target.includes('초')) { const m = target.match(/(\d+)\s*초/); return m ? parseInt(m[1]) : null; }
          if (target.includes('분')) { const m = target.match(/(\d+)\s*분/); return m ? parseInt(m[1]) * 60 : null; }
          return null;
        };

        function TimerSection({ method, recommendedClick, dripTargets, onBack, onComplete }) {
          const [isRunning, setIsRunning] = useState(false);
          const [preStartCountdown, setPreStartCountdown] = useState(null);
          const [time, setTime] = useState(0);
          const [phaseTime, setPhaseTime] = useState(0);
          const [isPrepped, setIsPrepped] = useState(false);
          const [currentClick, setCurrentClick] = useState(recommendedClick);
          const [laps, setLaps] = useState([]);
          const [dripPhase, setDripPhase] = useState(0);
          const timerRef = useRef(null);

          useEffect(() => { setCurrentClick(recommendedClick); }, [recommendedClick]);

          useEffect(() => {
            if (preStartCountdown === null) return;
            if (preStartCountdown > 0) {
              const timer = setTimeout(() => setPreStartCountdown(c => c - 1), 1000);
              return () => clearTimeout(timer);
            } else if (preStartCountdown === 0) {
              setIsRunning(true);
              timerRef.current = setInterval(() => { setTime(t => t + 1); setPhaseTime(pt => pt + 1); }, 1000);
              setPreStartCountdown(null);
            }
          }, [preStartCountdown]);

          const startTimer = () => { if (preStartCountdown === null && !isRunning) setPreStartCountdown(3); };
          const stopTimer = () => { setIsRunning(false); clearInterval(timerRef.current); onComplete(time, currentClick, laps); };
          useEffect(() => () => clearInterval(timerRef.current), []);

          const isPreInfusion = method === 'espresso' && isRunning && time <= 8;

          const handleLap = () => {
            setLaps([...laps, { phase: dripPhase, time }]);
            setDripPhase(p => p + 1);
            setPhaseTime(0);
          };

          if (!isPrepped) {
            if (method === 'espresso') {
              return (
                <div className="space-y-6 h-full flex flex-col">

                    </div>
                  </div>
                  <button onClick={() => setIsPrepped(true)} className="w-full bg-orange-600 text-white font-bold text-xl py-5 rounded-2xl shadow-lg active:scale-95">예열 및 건조 완료</button>
                </div>
              );

              return (

                    <h2 className="text-xl font-bold text-white">추출 준비</h2>
                  </div>

                      <p className="text-neutral-400 px-4 leading-relaxed">종이 필터를 뜨거운 물로 적셔 린싱(Rinsing)하여 종이 냄새를 제거하세요.<br/><br/>린싱 후, 서버에 고인 물은 반드시 버려주세요!</p>
                    </div>

                  <button onClick={() => setIsPrepped(true)} className="w-full bg-blue-600 text-white font-bold text-xl py-5 rounded-2xl shadow-lg active:scale-95">린싱 및 물 버리기 완료</button>
                </div>
              );
            }
          }

          return (

              </div>
              <div className="bg-gradient-to-br from-neutral-800 to-neutral-900 border border-neutral-700 p-4 rounded-2xl shadow-lg">
                <div className="flex justify-between items-center mb-4">
                  <div className="text-center px-4">

                  </div>
                  <div className="w-px h-12 bg-neutral-700"></div>
                  <div className="text-center flex flex-col items-center px-2">
                    <p className="text-xs text-amber-500 font-bold mb-1">적용할 클릭</p>
                    <div className="flex items-center gap-4">
                      <button onClick={() => setCurrentClick(c => c - 1)} className="p-1 text-neutral-400"><IconMinusCircle size={28} /></button>

                  <p className="text-sm text-neutral-300 leading-tight">{method === 'espresso' ? '저울 영점을 맞추고 시작 버튼을 누르세요.' : '원두를 담고 저울 영점을 맞추세요.'}</p>

                      {8 - time <= 3 && 8 - time > 0 && <p className="text-3xl font-black text-red-500 mt-1">{8 - time}초 후 손 떼기!</p>}

                          </div>

                      </div>
                      {dripPhase < dripTargets.length - 1 ? (
                        <button onClick={handleLap} className="w-full bg-amber-600 text-white font-bold text-lg py-4 rounded-xl active:scale-95">{dripTargets[dripPhase].target} 확인 (구간 기록)</button>
                      ) : (
                        <button onClick={stopTimer} className="w-full bg-red-600 text-white font-bold text-lg py-4 rounded-xl active:scale-95">물 빠짐 완료 (추출 종료)</button>
                      )}
                    </div>
                  )}
                </div>
              </div>
              <div className="mt-auto">
                {!isRunning ? (
                  <button onClick={startTimer} disabled={preStartCountdown !== null} className={`w-full font-bold text-xl py-5 rounded-2xl flex items-center justify-center gap-2 ${preStartCountdown !== null ? 'bg-neutral-700 text-neutral-500 cursor-not-allowed' : 'bg-emerald-600 text-white active:scale-95'}`}>
                    <IconPlay size={28} /> {preStartCountdown !== null ? '준비 중...' : '추출 시작'}
                  </button>
                ) : (
                  method === 'espresso' && (
                    <button onClick={stopTimer} className="w-full bg-red-600 text-white font-bold text-xl py-5 rounded-2xl flex items-center justify-center gap-2 active:scale-95">
                      <IconSquare size={28} /> 추출 정지
                    </button>
                  )
                )}
              </div>
            </div>
          );
        }

        // --- History Tab Component ---
        function HistoryTab({ history }) {
          const [filter, setFilter] = useState('all');
          const espressoCount = history.filter(log => log.method === 'espresso').length;
          const dripCount = history.filter(log => log.method === 'drip').length;
          const filteredHistory = history.filter(log => filter === 'all' || log.method === filter);

          return (
            <div className="space-y-4">
              <div className="flex items-center justify-between mb-2">
                <h2 className="text-2xl font-bold text-white">추출 기록</h2>
                <div className="flex bg-neutral-800 rounded-lg p-1">
                  <button onClick={() => setFilter('all')} className={`px-3 py-1 text-sm rounded-md ${filter === 'all' ? 'bg-amber-600 text-white' : 'text-neutral-400'}`}>전체</button>
                  <button onClick={() => setFilter('espresso')} className={`px-3 py-1 text-sm rounded-md ${filter === 'espresso' ? 'bg-amber-600 text-white' : 'text-neutral-400'}`}>에스프레소</button>
                  <button onClick={() => setFilter('drip')} className={`px-3 py-1 text-sm rounded-md ${filter === 'drip' ? 'bg-amber-600 text-white' : 'text-neutral-400'}`}>드립</button>
                </div>
              </div>
              <div className="flex gap-4 mb-4 text-xs font-medium text-neutral-400">
                <div className="bg-neutral-800 px-3 py-1.5 rounded-md">누적 에쏘 <span className="text-amber-500 font-bold">{espressoCount}잔</span></div>
                <div className="bg-neutral-800 px-3 py-1.5 rounded-md">누적 드립 <span className="text-amber-500 font-bold">{dripCount}잔</span></div>
              </div>
              
              {filteredHistory.length === 0 ? (
                <div className="text-center py-10 text-neutral-500">기록이 없습니다.</div>
              ) : (
                <div className="space-y-4">
                  {filteredHistory.map(log => (
                    <div key={log.id} className="bg-neutral-800 border border-neutral-700 rounded-xl p-4">
                      <div className="flex justify-between items-start mb-3">
                        <div>
                          <div className="flex gap-2 mb-1">
                            <span className="px-2 py-1 bg-neutral-700 text-neutral-300 text-[10px] rounded">{log.method === 'espresso' ? '에스프레소' : '드립'}</span>
                          </div>
                          <h3 className="font-bold text-white text-lg">{log.bean}</h3>
                          <p className="text-xs text-neutral-400">{log.date} · {log.grinder}</p>
                        </div>
                        <div className="text-right">
                          <div className="text-2xl font-mono font-bold text-amber-500">{Math.floor(log.time / 60) > 0 ? `${Math.floor(log.time / 60)}분 ` : ''}{log.time % 60}s</div>
                          <div className="text-sm text-neutral-400">{log.click} 클릭</div>
                        </div>
                      </div>
                      <div className={`mt-3 p-3 rounded-lg text-sm ${log.evaluation.status === 'perfect' ? 'bg-emerald-900/30 text-emerald-300' : 'bg-amber-900/30 text-amber-300'}`}>
                        <p className="font-semibold mb-1">{log.evaluation.message}</p>
                        <p className="opacity-80">{log.evaluation.tip}</p>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        }

        // --- Recs Tab Component ---
        function RecsTab({ beans, recommendations }) {
          const getDefaults = (roastId) => ROAST_LEVELS.find(r => r.id === roastId) || {};
          return (
            <div className="space-y-4">
              <h2 className="text-2xl font-bold text-white mb-4">추천 분쇄도 표</h2>
              <div className="space-y-4">
                {beans.map(bean => {
                  const def = getDefaults(bean.roast);
                  const renderVal = (m, g, d) => {
                    const c = recommendations[`${bean.id}_${m}_${g}`];
                    return c && c !== d ? (
                      <div className="flex items-center gap-1"><span className="text-neutral-500 line-through text-xs font-mono">{d}</span><IconChevronRight size={12} className="text-neutral-600"/><span className="text-amber-500 font-bold font-mono text-base">{c}</span></div>
                    ) : <span className="text-white font-bold font-mono text-base">{d || '-'}</span>;
                  };

                  return (
                    <div key={bean.id} className="bg-neutral-800 border border-neutral-700 rounded-xl p-4">
                      <h3 className="font-bold text-white text-lg">{bean.name} <span className="text-xs font-normal text-amber-500 ml-2">{def.label}</span></h3>
                      <div className="grid grid-cols-2 gap-3 mt-3">
                        <div className="bg-neutral-900/60 p-3 rounded-lg"><div className="text-[10px] text-neutral-400 mb-2">에스프레소</div><div className="flex justify-between mb-1"><span className="text-xs text-neutral-300">A2</span>{renderVal('espresso','a2',def.a2Esp)}</div><div className="flex justify-between"><span className="text-xs text-neutral-300">M40</span>{renderVal('espresso','m40',def.m40Esp)}</div></div>
                        <div className="bg-neutral-900/60 p-3 rounded-lg"><div className="text-[10px] text-neutral-400 mb-2">드립</div><div className="flex justify-between mb-1"><span className="text-xs text-neutral-300">A2</span>{renderVal('drip','a2',def.a2Drip)}</div><div className="flex justify-between"><span className="text-xs text-neutral-300">M40</span>{renderVal('drip','m40',def.m40Drip)}</div></div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
