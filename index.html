<!DOCTYPE html>

<html lang="ko">

<head>

 <meta charset="UTF-8">

 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

 <title>Coffee Dial-in Tracker</title>

 <!-- Tailwind CSS -->

 <script src="https://cdn.tailwindcss.com"></script>

 <!-- React & ReactDOM -->

 <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

 <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

 <!-- Lucide Icons -->

 <script>window.react = window.React;</script>

 <script src="https://unpkg.com/lucide-react@0.544.0/dist/umd/lucide-react.min.js" crossorigin></script>

 <!-- Babel -->

 <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

 <style>

 body { 

 background-color: #171717; 

 color: #f5f5f5; 

 -webkit-tap-highlight-color: transparent; 

 font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;

 }

 .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }

 ::-webkit-scrollbar { width: 0px; background: transparent; }

 </style>

</head>

<body>

 <div id="root"></div>




 <script type="text/babel">

 const { 

 Coffee, 

 Timer: TimerIcon, 

 History, 

 Plus, 

 ChevronRight, 

 ChevronLeft,

 Play, 

 Square,

 RotateCcw,

 Check,

 PlusCircle,

 MinusCircle,

 AlertCircle,

 Flame,

 Droplets,

 Trash2,

 Sliders,

 Download,

 Upload,

 Mail

 } = LucideReact;




 const ROAST_LEVELS = [

 { id: 'dark', label: '강배전', a2Esp: 32, a2Drip: 44, m40Esp: 28, m40Drip: 46 },

 { id: 'med-dark', label: '중강배전', a2Esp: 30, a2Drip: 42, m40Esp: 26, m40Drip: 44 },

 { id: 'medium', label: '중배전', a2Esp: 29, a2Drip: 40, m40Esp: 24, m40Drip: 42 },

 { id: 'med-light', label: '중약배전', a2Esp: 28, a2Drip: 38, m40Esp: 22, m40Drip: 39 },

 { id: 'light', label: '약배전', a2Esp: 27, a2Drip: 36, m40Esp: 20, m40Drip: 35 },

 ];




 const INITIAL_BEANS = [

 { id: 'b1', name: '폴 바셋 (시그니처)', roast: 'dark' },

 { id: 'b2', name: '블루보틀 볼드', roast: 'med-dark' },

 { id: 'b3', name: '블루보틀 에스프레소', roast: 'medium' },

 { id: 'b4', name: '블루보틀 밸런스', roast: 'med-light' },

 { id: 'b5', name: '블루보틀 브라이트', roast: 'light' },

 ];




 const GRINDERS = [

 { id: 'a2', name: '페모북 A2 (M8 개조)' },

 { id: 'm40', name: '미스치프 M40 (RC)' }

 ];




 const PRESET_RECIPES = {

 golden: [

 { label: "1차 주수", target: "50g", hint: "50g까지 원을 그리며 붓고 버튼을 누르세요." },

 { label: "뜸들이기", target: "30초", hint: "타이머가 30초가 될 때까지 기다립니다." },

 { label: "2차 주수", target: "150g", hint: "150g까지 부드럽게 나선형으로 붓습니다." },

 { label: "3차 주수", target: "250g", hint: "250g까지 부은 후 스며들기를 기다립니다." },

 { label: "물 빠짐 완료", target: "완료", hint: "물이 모두 빠지면 완료 버튼을 누르세요." }

 ],

 immersion: [

 { label: "전체 주수", target: "200g", hint: "200g까지 한 번에 부어주세요." },

 { label: "침출 대기", target: "2분", hint: "타이머 2분이 될 때까지 기다립니다." },

 { label: "스위치 개방", target: "스위치 ON", hint: "스위치를 열어 물을 배수시킵니다." },

 { label: "물 빠짐 완료", target: "완료", hint: "배수가 모두 끝나면 완료 버튼을 누르세요." }

 ]

 };




 function App() {

 const [activeTab, setActiveTab] = React.useState('brew');

 

 const [beans, setBeans] = React.useState(() => {

 try {

 const saved = localStorage.getItem('dialin-beans');

 return saved ? JSON.parse(saved) : INITIAL_BEANS;

 } catch (e) { return INITIAL_BEANS; }

 });

 const [history, setHistory] = React.useState(() => {

 try {

 const saved = localStorage.getItem('dialin-history');

 return saved ? JSON.parse(saved) : [];

 } catch (e) { return []; }

 });

 const [recommendations, setRecommendations] = React.useState(() => {

 try {

 const saved = localStorage.getItem('dialin-recs');

 return saved ? JSON.parse(saved) : {};

 } catch (e) { return {}; }

 });




 React.useEffect(() => { 

 try { localStorage.setItem('dialin-beans', JSON.stringify(beans)); } catch (e) {} 

 }, [beans]);

 

 React.useEffect(() => { 

 try { localStorage.setItem('dialin-history', JSON.stringify(history)); } catch (e) {} 

 }, [history]);

 

 React.useEffect(() => { 

 try { localStorage.setItem('dialin-recs', JSON.stringify(recommendations)); } catch (e) {} 

 }, [recommendations]);




 const today = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });




 return (

 <div className="min-h-screen bg-neutral-900 text-neutral-100 font-sans flex flex-col">

 <header className="bg-neutral-950 p-4 border-b border-neutral-800 flex justify-between items-center sticky top-0 z-10">

 <div className="flex items-center gap-2">

 <Coffee className="text-amber-500" />

 <h1 className="text-lg font-bold tracking-wide">Dial-in Tracker</h1>

 </div>

 <div className="flex items-center gap-3">

 <div className="flex flex-col items-end">

 <span className="text-[10px] text-amber-500 font-mono font-bold tracking-wider">v1.3.0</span>

 <span className="text-[10px] text-neutral-400">{today}</span>

 </div>

 <button 

 onClick={() => setActiveTab('settings')} 

 className={`p-2 rounded-lg border transition-colors ${activeTab === 'settings' ? 'bg-amber-600 border-amber-500 text-white' : 'bg-neutral-800 border-neutral-700 text-neutral-300'}`}

 title="백업 및 설정"

 >

 <Download size={18} />

 </button>

 </div>

 </header>




 <main className="flex-1 overflow-y-auto p-4 pb-24">

 {activeTab === 'brew' && (

 <BrewWizard 

 beans={beans} 

 setBeans={setBeans}

 recommendations={recommendations}

 setRecommendations={setRecommendations}

 onSaveLog={(log) => {

 setHistory([log, ...history]);

 setActiveTab('history');

 }}

 />

 )}

 {activeTab === 'recs' && (

 <RecsTab beans={beans} recommendations={recommendations} />

 )}

 {activeTab === 'history' && (

 <HistoryTab history={history} />

 )}

 {activeTab === 'settings' && (

 <SettingsTab 

 beans={beans} 

 history={history} 

 recommendations={recommendations}

 onRestore={(data) => {

 if (data.beans) setBeans(data.beans);

 if (data.history) setHistory(data.history);

 if (data.recommendations) setRecommendations(data.recommendations);

 alert('데이터를 성공적으로 복원했습니다!');

 }}

 />

 )}

 </main>




 <nav className="bg-neutral-950 border-t border-neutral-800 fixed bottom-0 w-full flex justify-around p-3 pb-safe z-10">

 <button onClick={() => setActiveTab('brew')} className={`flex flex-col items-center gap-1 w-20 ${activeTab === 'brew' ? 'text-amber-500' : 'text-neutral-500'}`}>

 <TimerIcon size={24} /><span className="text-xs font-medium">추출</span>

 </button>

 <button onClick={() => setActiveTab('recs')} className={`flex flex-col items-center gap-1 w-20 ${activeTab === 'recs' ? 'text-amber-500' : 'text-neutral-500'}`}>

 <Sliders size={24} /><span className="text-xs font-medium">추천값</span>

 </button>

 <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center gap-1 w-20 ${activeTab === 'history' ? 'text-amber-500' : 'text-neutral-500'}`}>

 <History size={24} /><span className="text-xs font-medium">기록</span>

 </button>

 <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center gap-1 w-20 ${activeTab === 'settings' ? 'text-amber-500' : 'text-neutral-500'}`}>

 <Download size={24} /><span className="text-xs font-medium">백업/설정</span>

 </button>

 </nav>

 </div>

 );

 }




 function BrewWizard({ beans, setBeans, recommendations, setRecommendations, onSaveLog }) {

 const [step, setStep] = React.useState(1);

 const [method, setMethod] = React.useState('');

 const [beanId, setBeanId] = React.useState('');

 const [grinderId, setGrinderId] = React.useState('');

 const [dripRecipeType, setDripRecipeType] = React.useState('golden');

 const [dripTargets, setDripTargets] = React.useState(PRESET_RECIPES.golden);

 const [time, setTime] = React.useState(0);

 const [adjustedTime, setAdjustedTime] = React.useState(0);

 const [recommendedClick, setRecommendedClick] = React.useState(0);

 const [usedClick, setUsedClick] = React.useState(0);

 const [lapTimes, setLapTimes] = React.useState([]);




 const getDefaultClick = (bId, mthd, gId) => {

 const bean = beans.find(b => b.id === bId);

 if (!bean) return 0;

 const roastData = ROAST_LEVELS.find(r => r.id === bean.roast);

 if (!roastData) return 0;

 return mthd === 'espresso' ? (gId === 'a2' ? roastData.a2Esp : roastData.m40Esp) : (gId === 'a2' ? roastData.a2Drip : roastData.m40Drip);

 };




 const handleNextStep = () => {

 if (step === 3 && method === 'espresso') setStep(5);

 else setStep(s => s + 1);

 };

 

 const handlePrevStep = () => {

 if (step === 5 && method === 'espresso') setStep(3);

 else setStep(s => Math.max(1, s - 1));

 };




 if (step === 1) return (

 <div className="space-y-4">

 <h2 className="text-xl font-bold text-white mb-6">어떤 커피를 내리실 건가요?</h2>

 <div className="grid grid-cols-2 gap-4">

 <SelectionCard title="에스프레소" subtitle="밤비노 플러스" icon={<Coffee size={32} />} selected={method === 'espresso'} onClick={() => { setMethod('espresso'); handleNextStep(); }} />

 <SelectionCard title="드립 (푸어오버)" subtitle="하리오 스위치" icon={<TimerIcon size={32} />} selected={method === 'drip'} onClick={() => { setMethod('drip'); handleNextStep(); }} />

 </div>

 </div>

 );




 if (step === 2) return (

 <div className="space-y-4">

 <div className="flex items-center gap-2 mb-6">

 <button onClick={handlePrevStep} className="text-neutral-400 p-1 -ml-1"><ChevronLeft size={24} /></button>

 <h2 className="text-xl font-bold text-white">원두를 선택하세요</h2>

 </div>

 <div className="space-y-3">

 {beans.map(bean => (

 <div key={bean.id} onClick={() => { setBeanId(bean.id); handleNextStep(); }} className="bg-neutral-800 border border-neutral-700 p-4 rounded-xl flex justify-between items-center cursor-pointer">

 <div>

 <p className="font-semibold text-white text-lg">{bean.name}</p>

 <p className="text-sm text-neutral-400">{ROAST_LEVELS.find(r => r.id === bean.roast)?.label}</p>

 </div>

 <ChevronRight className="text-neutral-500" />

 </div>

 ))}

 <AddNewBeanForm onAdd={(newBean) => { setBeans([...beans, newBean]); setBeanId(newBean.id); handleNextStep(); }} />

 </div>

 </div>

 );




 if (step === 3) return (

 <div className="space-y-4">

 <div className="flex items-center gap-2 mb-6">

 <button onClick={handlePrevStep} className="text-neutral-400 p-1 -ml-1"><ChevronLeft size={24} /></button>

 <h2 className="text-xl font-bold text-white">그라인더 선택</h2>

 </div>

 <div className="space-y-3">

 {GRINDERS.map(g => (

 <div key={g.id} onClick={() => { 

 setGrinderId(g.id); 

 const recKey = `${beanId}_${method}_${g.id}`;

 setRecommendedClick(recommendations[recKey] || getDefaultClick(beanId, method, g.id));

 handleNextStep(); 

 }} className="bg-neutral-800 border border-neutral-700 p-4 rounded-xl flex justify-between items-center cursor-pointer">

 <p className="font-semibold text-white text-lg">{g.name}</p>

 <ChevronRight className="text-neutral-500" />

 </div>

 ))}

 </div>

 </div>

 );




 if (step === 4) return <RecipeSelection onBack={handlePrevStep} onSelect={(type, targets) => { setDripRecipeType(type); setDripTargets(targets); handleNextStep(); }} />;




 if (step === 5) return <TimerSection method={method} recommendedClick={recommendedClick} dripTargets={dripTargets} onBack={handlePrevStep} onComplete={(finalTime, finalClick, finalLaps) => { setTime(finalTime); setAdjustedTime(finalTime); setUsedClick(finalClick); setLapTimes(finalLaps); setStep(6); }} />;




 if (step === 6) {

 const handleEvaluateAndSave = () => {

 let evalResult = {};

 let nextClick = usedClick;

 let clickDelta = grinderId === 'a2' ? 1 : 2;




 if (method === 'espresso') {

 if (adjustedTime < 20) { evalResult = { status: 'fast', message: '너무 빠릅니다 (과소추출).', tip: `다음엔 분쇄도를 ${clickDelta * 2}클릭 조여보세요.` }; nextClick -= (clickDelta * 2); }

 else if (adjustedTime >= 20 && adjustedTime < 25) { evalResult = { status: 'fast-ish', message: '약간 빠릅니다.', tip: `다음엔 분쇄도를 ${clickDelta}클릭 조여보세요.` }; nextClick -= clickDelta; }

 else if (adjustedTime >= 25 && adjustedTime <= 30) { evalResult = { status: 'perfect', message: '완벽합니다!', tip: '현재 세팅을 유지하세요.' }; }

 else if (adjustedTime > 30 && adjustedTime <= 35) { evalResult = { status: 'slow-ish', message: '약간 느립니다.', tip: `다음엔 분쇄도를 ${clickDelta}클릭 풀어보세요.` }; nextClick += clickDelta; }

 else { evalResult = { status: 'slow', message: '너무 느립니다 (과다추출).', tip: `다음엔 분쇄도를 ${clickDelta * 2}클릭 풀어보세요.` }; nextClick += (clickDelta * 2); }

 } else {

 const finalDrawdown = adjustedTime - (lapTimes.length > 0 ? lapTimes[lapTimes.length - 1].time : 0);

 if (dripRecipeType === 'golden') {

 if (finalDrawdown < 25) { evalResult = { status: 'fast', message: `물 빠짐이 빠릅니다 (${finalDrawdown}초).`, tip: `다음엔 분쇄도를 ${clickDelta * 2}클릭 조여보세요.` }; nextClick -= (clickDelta * 2); }

 else if (finalDrawdown > 55) { evalResult = { status: 'slow', message: `물 빠짐이 지연되었습니다 (${finalDrawdown}초).`, tip: `다음엔 분쇄도를 ${clickDelta * 2}클릭 풀어보세요.` }; nextClick += (clickDelta * 2); }

 else { evalResult = { status: 'perfect', message: `적절한 물 빠짐 시간입니다 (${finalDrawdown}초).`, tip: '현재 세팅을 유지하세요.' }; }

 } else {

 if (finalDrawdown > 50) { evalResult = { status: 'slow', message: `배수가 느립니다 (${finalDrawdown}초).`, tip: `다음엔 분쇄도를 ${clickDelta * 2}클릭 풀어보세요.` }; nextClick += (clickDelta * 2); }

 else if (finalDrawdown < 20) { evalResult = { status: 'fast', message: `배수가 빠릅니다 (${finalDrawdown}초).`, tip: `다음엔 분쇄도를 ${clickDelta * 2}클릭 조여보세요.` }; nextClick -= (clickDelta * 2); }

 else { evalResult = { status: 'perfect', message: `안정적인 배수 시간입니다 (${finalDrawdown}초)!`, tip: '현재 세팅을 유지하세요.' }; }

 }

 }




 const recKey = `${beanId}_${method}_${grinderId}`;

 setRecommendations(prev => ({ ...prev, [recKey]: nextClick }));

 

 onSaveLog({

 id: Date.now().toString(),

 date: new Date().toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),

 method, recipeType: method === 'drip' ? dripRecipeType : null,

 bean: beans.find(b => b.id === beanId)?.name,

 grinder: GRINDERS.find(g => g.id === grinderId)?.name,

 click: usedClick, time: adjustedTime, laps: lapTimes,

 evaluation: evalResult, nextClick: nextClick

 });

 };




 return (

 <div className="space-y-6">

 <div className="flex items-center gap-2 mb-2">

 <button onClick={() => setStep(5)} className="text-neutral-400 p-1 -ml-1"><ChevronLeft size={24} /></button>

 <h2 className="text-xl font-bold text-white">시간 조정 및 기록</h2>

 </div>

 <div className="bg-neutral-800 rounded-2xl p-8 flex flex-col items-center justify-center gap-6 shadow-inner">

 <div className="text-6xl font-mono font-bold text-amber-500">

 {Math.floor(adjustedTime / 60) > 0 && <span>{Math.floor(adjustedTime / 60)}m </span>}

 <span>{adjustedTime % 60}s</span>

 </div>

 <div className="flex gap-6">

 <button onClick={() => setAdjustedTime(t => Math.max(0, t - 1))} className="p-4 bg-neutral-700 rounded-full"><MinusCircle size={32} className="text-white" /></button>

 <button onClick={() => setAdjustedTime(t => t + 1)} className="p-4 bg-neutral-700 rounded-full"><PlusCircle size={32} className="text-white" /></button>

 </div>

 </div>

 <button onClick={handleEvaluateAndSave} className="w-full bg-amber-600 text-white font-bold text-lg py-4 rounded-xl flex items-center justify-center gap-2">

 <Check size={24} /> 결과 분석 및 기록 저장

 </button>

 </div>

 );

 }

 return null;

 }




 function SelectionCard({ title, subtitle, icon, selected, onClick }) {

 return (

 <div onClick={onClick} className={`p-4 rounded-2xl border-2 flex flex-col items-center gap-3 cursor-pointer ${selected ? 'border-amber-500 bg-amber-500/10' : 'border-neutral-700 bg-neutral-800'}`}>

 <div className={`p-3 rounded-full ${selected ? 'bg-amber-500/20 text-amber-500' : 'bg-neutral-700 text-neutral-400'}`}>{icon}</div>

 <div className="text-center"><p className="font-bold text-white">{title}</p><p className="text-xs text-neutral-400">{subtitle}</p></div>

 </div>

 );

 }




 function AddNewBeanForm({ onAdd }) {

 const [isOpen, setIsOpen] = React.useState(false);

 const [name, setName] = React.useState('');

 const [roast, setRoast] = React.useState('medium');

 if (!isOpen) return <div onClick={() => setIsOpen(true)} className="border border-dashed border-neutral-600 p-4 rounded-xl flex justify-center items-center gap-2 text-neutral-400 cursor-pointer"><Plus size={20} /><span className="font-semibold">새로운 원두 추가</span></div>;

 return (

 <div className="bg-neutral-800 border border-neutral-700 p-4 rounded-xl space-y-4">

 <h3 className="font-bold text-white mb-2">새 원두 등록</h3>

 <input type="text" placeholder="원두 이름" value={name} onChange={(e) => setName(e.target.value)} className="w-full bg-neutral-900 border border-neutral-700 rounded-lg p-3 text-white" />

 <select value={roast} onChange={(e) => setRoast(e.target.value)} className="w-full bg-neutral-900 border border-neutral-700 rounded-lg p-3 text-white">

 {ROAST_LEVELS.map(r => <option key={r.id} value={r.id}>{r.label}</option>)}

 </select>

 <div className="flex gap-2 pt-2">

 <button onClick={() => setIsOpen(false)} className="flex-1 bg-neutral-700 text-white p-3 rounded-lg">취소</button>

 <button onClick={() => { if(name.trim()) { onAdd({ id: 'custom_' + Date.now(), name, roast }); setIsOpen(false); } }} className="flex-1 bg-amber-600 text-white p-3 rounded-lg">추가하기</button>

 </div>

 </div>

 );

 }




 function RecipeSelection({ onBack, onSelect }) {

 const [customMode, setCustomMode] = React.useState(false);

 const [customPhases, setCustomPhases] = React.useState([

 { label: "1차 주수", target: "50g", hint: "설정한 목표량까지 물을 붓습니다." },

 { label: "물 빠짐 완료", target: "완료", hint: "물이 모두 빠지면 완료 버튼을 누르세요." }

 ]);

 const [newLabel, setNewLabel] = React.useState('');

 const [newTarget, setNewTarget] = React.useState('');




 const handleAddPhase = () => {

 if(newLabel && newTarget) {

 const newPhase = { label: newLabel, target: newTarget, hint: "목표 도달 시 누르세요." };

 const updated = [...customPhases];

 updated.splice(updated.length - 1, 0, newPhase);

 setCustomPhases(updated);

 setNewLabel('');

 setNewTarget('');

 }

 };




 if (customMode) return (

 <div className="space-y-4">

 <div className="flex items-center gap-2 mb-4">

 <button onClick={() => setCustomMode(false)} className="text-neutral-400 p-1 -ml-1"><ChevronLeft size={24} /></button>

 <h2 className="text-xl font-bold text-white">나만의 레시피 만들기</h2>

 </div>

 <div className="bg-neutral-800 p-4 rounded-xl space-y-3">

 {customPhases.map((phase, idx) => (

 <div key={idx} className="flex justify-between items-center bg-neutral-900 p-3 rounded-lg border border-neutral-700">

 <div><span className="text-amber-500 font-bold text-sm mr-2">{idx + 1}단계</span><span className="text-white font-medium">{phase.label}</span></div>

 <span className="font-mono text-neutral-400 font-bold">{phase.target}</span>

 </div>

 ))}

 <div className="flex gap-2 pt-2 border-t border-neutral-700 mt-2">

 <input type="text" placeholder="단계명" value={newLabel} onChange={(e) => setNewLabel(e.target.value)} className="flex-1 bg-neutral-900 border border-neutral-700 rounded-lg p-2 text-white text-sm" />

 <input type="text" placeholder="목표(예: 150g)" value={newTarget} onChange={(e) => setNewTarget(e.target.value)} className="w-24 bg-neutral-900 border border-neutral-700 rounded-lg p-2 text-white text-sm" />

 <button onClick={handleAddPhase} className="bg-neutral-700 p-2 rounded-lg text-white"><Plus size={20} /></button>

 </div>

 </div>

 <button onClick={() => onSelect('custom', customPhases)} className="w-full bg-amber-600 text-white font-bold py-4 rounded-xl shadow-lg mt-4">이 레시피로 추출 시작</button>

 </div>

 );




 return (

 <div className="space-y-4">

 <div className="flex items-center gap-2 mb-6"><button onClick={onBack} className="text-neutral-400 p-1 -ml-1"><ChevronLeft size={24} /></button><h2 className="text-xl font-bold text-white">드립 레시피 선택</h2></div>

 <div className="grid grid-cols-1 gap-3">

 <div onClick={() => onSelect('golden', PRESET_RECIPES.golden)} className="bg-neutral-800 border border-neutral-700 p-4 rounded-xl cursor-pointer"><p className="font-bold text-white text-lg mb-1">골든컵 (투과식)</p><p className="text-sm text-neutral-400">50g 뜸들이기 후 정석 레시피</p></div>

 <div onClick={() => onSelect('immersion', PRESET_RECIPES.immersion)} className="bg-neutral-800 border border-neutral-700 p-4 rounded-xl cursor-pointer"><p className="font-bold text-white text-lg mb-1">스위치 침출식</p><p className="text-sm text-neutral-400">2분 대기 후 스위치 개방</p></div>

 <div onClick={() => setCustomMode(true)} className="border-2 border-dashed border-neutral-600 p-4 rounded-xl flex items-center gap-3 text-neutral-400 cursor-pointer"><PlusCircle size={24} /><div><p className="font-bold text-lg mb-0.5">나만의 레시피 만들기</p><p className="text-sm opacity-80">원하는 구간과 목표량 직접 설정</p></div></div>

 </div>

 </div>

 );

 }




 const parseTargetTime = (target) => {

 if (!target) return null;

 if (target.includes('초')) { const m = target.match(/(\d+)\s*초/); return m ? parseInt(m[1]) : null; }

 if (target.includes('분')) { const m = target.match(/(\d+)\s*분/); return m ? parseInt(m[1]) * 60 : null; }

 return null;

 };




 function TimerSection({ method, recommendedClick, dripTargets, onBack, onComplete }) {

 const [isRunning, setIsRunning] = React.useState(false);

 const [preStartCountdown, setPreStartCountdown] = React.useState(null);

 const [time, setTime] = React.useState(0);

 const [phaseTime, setPhaseTime] = React.useState(0);

 const [isPrepped, setIsPrepped] = React.useState(false);

 const [currentClick, setCurrentClick] = React.useState(recommendedClick);

 const [laps, setLaps] = React.useState([]);

 const [dripPhase, setDripPhase] = React.useState(0);

 const timerRef = React.useRef(null);




 React.useEffect(() => { setCurrentClick(recommendedClick); }, [recommendedClick]);




 React.useEffect(() => {

 if (preStartCountdown === null) return;

 if (preStartCountdown > 0) {

 const timer = setTimeout(() => setPreStartCountdown(c => c - 1), 1000);

 return () => clearTimeout(timer);

 } else if (preStartCountdown === 0) {

 setIsRunning(true);

 timerRef.current = setInterval(() => { setTime(t => t + 1); setPhaseTime(pt => pt + 1); }, 1000);

 setPreStartCountdown(null);

 }

 }, [preStartCountdown]);




 const startTimer = () => { if (preStartCountdown === null && !isRunning) setPreStartCountdown(3); };

 const stopTimer = () => { setIsRunning(false); clearInterval(timerRef.current); onComplete(time, currentClick, laps); };

 React.useEffect(() => () => clearInterval(timerRef.current), []);




 const isPreInfusion = method === 'espresso' && isRunning && time <= 8;




 const handleLap = () => {

 setLaps([...laps, { phase: dripPhase, time }]);

 setDripPhase(p => p + 1);

 setPhaseTime(0);

 };




 if (!isPrepped) {

 if (method === 'espresso') return (

 <div className="space-y-6 h-full flex flex-col">

 <div className="flex items-center gap-2 mb-2"><button onClick={onBack} className="text-neutral-400 p-1 -ml-1"><ChevronLeft size={24} /></button><h2 className="text-xl font-bold text-white">추출 준비</h2></div>

 <div className="flex-1 flex flex-col items-center justify-center text-center space-y-6">

 <div className="bg-orange-900/20 p-6 rounded-full"><Flame size={64} className="text-orange-500" /></div>

 <div><h3 className="text-2xl font-bold text-white mb-2">포터필터 예열</h3><p className="text-neutral-400 px-4 leading-relaxed">빈 포터필터를 장착하고 1CUP 버튼으로 예열한 뒤, 내부 물기를 마른 천으로 완벽히 닦아주세요.</p></div>

 </div>

 <button onClick={() => setIsPrepped(true)} className="w-full bg-orange-600 text-white font-bold text-xl py-5 rounded-2xl">예열 및 건조 완료</button>

 </div>

 );

 return (

 <div className="space-y-6 h-full flex flex-col">

 <div className="flex items-center gap-2 mb-2"><button onClick={onBack} className="text-neutral-400 p-1 -ml-1"><ChevronLeft size={24} /></button><h2 className="text-xl font-bold text-white">추출 준비</h2></div>

 <div className="flex-1 flex flex-col items-center justify-center text-center space-y-6">

 <div className="bg-blue-900/20 p-6 rounded-full"><Droplets size={64} className="text-blue-400" /></div>

 <div><h3 className="text-2xl font-bold text-white mb-2">필터 린싱</h3><p className="text-neutral-400 px-4 leading-relaxed">종이 필터를 뜨거운 물로 린싱하고 서버에 고인 물은 반드시 버려주세요.</p></div>

 </div>

 <button onClick={() => setIsPrepped(true)} className="w-full bg-blue-600 text-white font-bold text-xl py-5 rounded-2xl">린싱 및 물 버리기 완료</button>

 </div>

 );

 }




 return (

 <div className="space-y-6 h-full flex flex-col">

 <div className="flex items-center gap-2 mb-2"><button onClick={onBack} className="text-neutral-400 p-1 -ml-1"><ChevronLeft size={24} /></button><h2 className="text-xl font-bold text-white">타이머 & 분쇄도</h2></div>

 

 <div className="bg-neutral-800 border border-neutral-700 p-4 rounded-2xl">

 <div className="flex justify-between items-center mb-2">

 <div className="text-center px-4"><p className="text-xs text-neutral-400">추천</p><span className="text-xl font-bold text-neutral-500">{recommendedClick}</span></div>

 <div className="w-px h-10 bg-neutral-700"></div>

 <div className="text-center flex flex-col items-center">

 <p className="text-xs text-amber-500 font-bold mb-1">적용할 클릭</p>

 <div className="flex items-center gap-3">

 <button onClick={() => setCurrentClick(c => c - 1)} className="text-neutral-400"><MinusCircle size={24} /></button>

 <span className="text-3xl font-black text-amber-500 w-12 text-center">{currentClick}</span>

 <button onClick={() => setCurrentClick(c => c + 1)} className="text-neutral-400"><PlusCircle size={24} /></button>

 </div>

 </div>

 </div>

 </div>




 <div className="flex-1 flex flex-col items-center justify-center py-2">

 <div className="text-neutral-400 text-sm font-medium mb-1">전체 추출 시간</div>

 {preStartCountdown !== null && preStartCountdown > 0 ? (

 <div className="text-9xl font-black text-amber-500 animate-ping my-4">{preStartCountdown}</div>

 ) : (

 <div className={`text-8xl font-mono font-light tracking-tighter ${isPreInfusion ? 'text-amber-400 animate-pulse' : 'text-white'}`}>

 {Math.floor(time / 60)}:{(time % 60).toString().padStart(2, '0')}

 </div>

 )}

 

 <div className="h-14 flex items-center justify-center mt-2 w-full">

 {isRunning && method === 'drip' && (() => {

 const targetSec = parseTargetTime(dripTargets[dripPhase]?.target);

 if (targetSec !== null) {

 const remain = targetSec - phaseTime;

 if (remain <= 3 && remain > 0) return <div className="text-5xl font-black text-red-500 animate-ping">-{remain}</div>;

 if (remain <= 0) return <div className="text-xl font-bold text-emerald-400">다음 단계 시작!</div>;

 return <div className="text-lg text-neutral-300 font-mono bg-neutral-800 px-4 py-2 rounded-full">대기: <span className="text-amber-400 font-bold">{remain}초</span> 남음</div>;

 }

 return null;

 })()}

 </div>




 <div className="mt-2 flex flex-col items-center justify-center w-full text-center">

 {isPreInfusion && <p className="text-amber-400 font-bold bg-amber-900/30 px-4 py-1.5 rounded-full">⏳ 8초 프리인퓨전 중! (3초 후 손 떼기)</p>}

 {isRunning && method === 'drip' && dripTargets[dripPhase] && (

 <p className="text-amber-400 font-medium bg-amber-900/30 px-4 py-2 rounded-lg w-full max-w-sm mb-2">👉 {dripTargets[dripPhase].hint}</p>

 )}

 {isRunning && method === 'drip' && (

 <div className="w-full mt-2">

 <div className="flex flex-wrap justify-center gap-2 mb-4 bg-neutral-950 p-2 rounded-xl">

 {dripTargets.map((t, i) => (

 <div key={i} className={`flex flex-col items-center p-1.5 rounded w-16 text-xs ${dripPhase === i ? 'bg-amber-900/50 text-white font-bold' : 'text-neutral-500'}`}>

 <span>{t.label}</span>

 <span>{t.target}</span>

 </div>

 ))}

 </div>

 {dripPhase < dripTargets.length - 1 ? (

 <button onClick={handleLap} className="w-full bg-amber-600 text-white font-bold text-lg py-4 rounded-xl shadow-lg">구간 기록 및 다음</button>

 ) : (

 <button onClick={stopTimer} className="w-full bg-red-600 text-white font-bold text-lg py-4 rounded-xl shadow-lg">물 빠짐 완료 (추출 종료)</button>

 )}

 </div>

 )}

 </div>

 </div>




 <div className="mt-auto">

 {!isRunning ? (

 <button onClick={startTimer} disabled={preStartCountdown !== null} className={`w-full font-bold text-xl py-5 rounded-2xl flex items-center justify-center gap-2 ${preStartCountdown !== null ? 'bg-neutral-700 text-neutral-500' : 'bg-emerald-600 text-white'}`}>

 <Play size={28} /> {preStartCountdown !== null ? '준비 중...' : '추출 시작'}

 </button>

 ) : method === 'espresso' && (

 <button onClick={stopTimer} className="w-full bg-red-600 text-white font-bold text-xl py-5 rounded-2xl flex items-center justify-center gap-2">

 <Square size={28} /> 추출 정지

 </button>

 )}

 </div>

 </div>

 );

 }




 function HistoryTab({ history }) {

 const [filter, setFilter] = React.useState('all');

 const espressoCount = history.filter(log => log.method === 'espresso').length;

 const dripCount = history.filter(log => log.method === 'drip').length;

 const filteredHistory = history.filter(log => filter === 'all' || log.method === filter);




 if (history.length === 0) return <div className="text-center py-20 text-neutral-500">아직 추출 기록이 없습니다.</div>;




 return (

 <div className="space-y-4">

 <div className="flex items-center justify-between mb-2">

 <h2 className="text-2xl font-bold text-white">추출 기록</h2>

 <div className="flex bg-neutral-800 rounded-lg p-1">

 <button onClick={() => setFilter('all')} className={`px-3 py-1 text-sm rounded-md ${filter === 'all' ? 'bg-amber-600 text-white' : 'text-neutral-400'}`}>전체</button>

 <button onClick={() => setFilter('espresso')} className={`px-3 py-1 text-sm rounded-md ${filter === 'espresso' ? 'bg-amber-600 text-white' : 'text-neutral-400'}`}>에소</button>

 <button onClick={() => setFilter('drip')} className={`px-3 py-1 text-sm rounded-md ${filter === 'drip' ? 'bg-amber-600 text-white' : 'text-neutral-400'}`}>드립</button>

 </div>

 </div>

 <div className="flex gap-4 mb-4 text-xs font-medium text-neutral-400">

 <div className="bg-neutral-800 px-3 py-1.5 rounded-md">누적 에쏘 <span className="text-amber-500 font-bold">{espressoCount}잔</span></div>

 <div className="bg-neutral-800 px-3 py-1.5 rounded-md">누적 드립 <span className="text-amber-500 font-bold">{dripCount}잔</span></div>

 </div>

 <div className="space-y-4">

 {filteredHistory.map(log => (

 <div key={log.id} className="bg-neutral-800 border border-neutral-700 rounded-xl p-4">

 <div className="flex justify-between items-start mb-3">

 <div>

 <span className="px-2 py-1 bg-neutral-700 text-neutral-300 text-[10px] rounded mb-1 inline-block">{log.method === 'espresso' ? '에스프레소' : '드립'}</span>

 <h3 className="font-bold text-white text-lg">{log.bean}</h3>

 <p className="text-xs text-neutral-400">{log.date} · {log.grinder}</p>

 </div>

 <div className="text-right">

 <div className="text-2xl font-mono font-bold text-amber-500">{log.time}s</div>

 <div className="text-sm text-neutral-400">{log.click} 클릭</div>

 </div>

 </div>

 <div className="mt-3 p-3 rounded-lg text-sm bg-neutral-900/50 border border-neutral-700">

 <p className="font-semibold text-amber-300 mb-1">{log.evaluation.message}</p>

 <p className="text-neutral-400 text-xs">{log.evaluation.tip}</p>

 </div>

 </div>

 ))}

 </div>

 </div>

 );

 }




 function RecsTab({ beans, recommendations }) {

 const getDefaults = (roastId) => ROAST_LEVELS.find(r => r.id === roastId) || {};

 return (

 <div className="space-y-4">

 <h2 className="text-2xl font-bold text-white mb-4">추천 분쇄도 표</h2>

 <div className="space-y-4">

 {beans.map(bean => {

 const def = getDefaults(bean.roast);

 const renderVal = (m, g, d) => {

 const c = recommendations[`${bean.id}_${m}_${g}`];

 return c && c !== d ? (

 <div className="flex items-center gap-1"><span className="text-neutral-500 line-through text-xs font-mono">{d}</span><ChevronRight size={12} /><span className="text-amber-500 font-bold font-mono text-base">{c}</span></div>

 ) : <span className="text-white font-bold font-mono text-base">{d || '-'}</span>;

 };




 return (

 <div key={bean.id} className="bg-neutral-800 border border-neutral-700 rounded-xl p-4">

 <h3 className="font-bold text-white text-lg mb-2">{bean.name} <span className="text-xs text-amber-500 font-normal">{def.label}</span></h3>

 <div className="grid grid-cols-2 gap-3">

 <div className="bg-neutral-900 p-3 rounded-lg"><div className="text-[10px] text-neutral-400 mb-1">에스프레소</div><div className="flex justify-between text-xs"><span>A2</span>{renderVal('espresso','a2',def.a2Esp)}</div><div className="flex justify-between text-xs mt-1"><span>M40</span>{renderVal('espresso','m40',def.m40Esp)}</div></div>

 <div className="bg-neutral-900 p-3 rounded-lg"><div className="text-[10px] text-neutral-400 mb-1">드립</div><div className="flex justify-between text-xs"><span>A2</span>{renderVal('drip','a2',def.a2Drip)}</div><div className="flex justify-between text-xs mt-1"><span>M40</span>{renderVal('drip','m40',def.m40Drip)}</div></div>

 </div>

 </div>

 );

 })}

 </div>

 </div>

 );

 }




 function SettingsTab({ beans, history, recommendations, onRestore }) {

 const [email, setEmail] = React.useState(() => {

 try { return localStorage.getItem('user-backup-email') || ''; } catch(e) { return ''; }

 });

 const fileInputRef = React.useRef(null);




 React.useEffect(() => {

 try { localStorage.setItem('user-backup-email', email); } catch(e) {}

 }, [email]);




 const handleExportJSON = () => {

 const data = { beans, history, recommendations, version: '1.3.0', exportedAt: new Date().toISOString() };

 const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));

 const downloadAnchor = document.createElement('a');

 downloadAnchor.setAttribute("href", dataStr);

 downloadAnchor.setAttribute("download", `coffee_dialin_backup_${new Date().toISOString().slice(0,10)}.json`);

 document.body.appendChild(downloadAnchor);

 downloadAnchor.click();

 downloadAnchor.remove();

 };




 const handleImportJSON = (e) => {

 const fileReader = new FileReader();

 if (e.target.files[0]) {

 fileReader.readAsText(e.target.files[0], "UTF-8");

 fileReader.onload = (event) => {

 try {

 const parsed = JSON.parse(event.target.result);

 onRestore(parsed);

 } catch (err) { alert('올바른 백업 파일 형식이 아닙니다.'); }

 };

 }

 };




 const handleSendEmail = () => {

 if (!email.trim()) { alert('전송할 메일 주소를 먼저 입력해 주세요.'); return; }

 const data = { beans, history, recommendations };

 const jsonString = JSON.stringify(data, null, 2);

 const subject = encodeURIComponent('[Coffee Tracker] 데이터 백업 파일');

 const body = encodeURIComponent(`백업 데이터:\n\n${jsonString}`);

 window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;

 };




 return (

 <div className="space-y-6">

 <h2 className="text-2xl font-bold text-white mb-2">백업 및 설정</h2>

 <div className="bg-neutral-800 border border-neutral-700 rounded-xl p-4 space-y-4">

 <h3 className="font-bold text-white text-lg flex items-center gap-2"><Download size={20} className="text-amber-500" /> 백업 파일(.json) 다운로드</h3>

 <button onClick={handleExportJSON} className="w-full bg-neutral-700 hover:bg-neutral-600 text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-2">

 <Download size={18} /> 파일 백업하기

 </button>

 </div>

 <div className="bg-neutral-800 border border-neutral-700 rounded-xl p-4 space-y-4">

 <h3 className="font-bold text-white text-lg flex items-center gap-2"><Mail size={20} className="text-amber-500" /> 이메일로 백업 전송</h3>

 <input type="email" placeholder="본인 메일 주소 입력" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full bg-neutral-900 border border-neutral-700 rounded-lg p-3 text-white text-sm" />

 <button onClick={handleSendEmail} className="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-2">

 <Mail size={18} /> 메일로 전송

 </button>

 </div>

 <div className="bg-neutral-800 border border-neutral-700 rounded-xl p-4 space-y-4">

 <h3 className="font-bold text-white text-lg flex items-center gap-2"><Upload size={20} className="text-amber-500" /> 데이터 가져오기 (복원)</h3>

 <input type="file" ref={fileInputRef} onChange={handleImportJSON} accept=".json" className="hidden" />

 <button onClick={() => fileInputRef.current.click()} className="w-full bg-neutral-700 hover:bg-neutral-600 text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-2">

 <Upload size={18} /> 백업 파일 불러오기

 </button>

 </div>

 </div>

 );

 }




 ReactDOM.createRoot(document.getElementById('root')).render(<App />);

 </script>
